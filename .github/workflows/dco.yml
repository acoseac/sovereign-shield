name: DCO

# Verifies every non-merge commit in a PR carries a `Signed-off-by:` trailer matching its
# author (the Developer Certificate of Origin, https://developercertificate.org/).
# Self-contained: no external action, just git + grep, so it's auditable at a glance.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco (sign-off present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            count=$((count + 1))
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            body="$(git show -s --format='%B' "$sha")"
            if printf '%s\n' "$body" | grep -qiE '^Signed-off-by: .+ <.+@.+>' \
               && printf '%s\n' "$body" | grep -qF "Signed-off-by: $author"; then
              echo "ok    $sha  $subject"
            else
              echo "FAIL  $sha  $subject"
              echo "      author is '$author' with no matching Signed-off-by trailer"
              fail=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ "$count" -eq 0 ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "DCO check failed — sign your commits:"
            echo "  git commit -s                       # new commits"
            echo "  git rebase --signoff $BASE_SHA      # existing commits, then force-push"
            exit 1
          fi
