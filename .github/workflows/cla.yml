name: CLA

# Self-hosted CLA gate (cla-assistant-lite). Signatures are stored in this repo's
# `cla-signatures` branch — no third-party SaaS, no data leaves GitHub. On brand for a
# sovereignty tool. `pull_request_target` is safe here: this workflow never checks out or
# runs the PR's code, it only reads events and writes the signature file.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write # write signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla (signed)
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: >-
          (github.event.action == 'created' &&
           contains(github.event.comment.body, 'I have read the CLA and I hereby sign the CLA'))
          || github.event_name == 'pull_request_target'
        # Pin verified against releases; bump when you update:
        # https://github.com/contributor-assistant/github-action/releases
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/acoseac/sovereign-shield/blob/main/CLA.md
          branch: cla-signatures
          # Maintainers and bots never need to sign:
          allowlist: acoseac,dependabot[bot],*[bot]
          custom-pr-sign-comment: I have read the CLA and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thanks for the contribution! Before this can be merged, please sign the
            [Sovereign Shield CLA](https://github.com/acoseac/sovereign-shield/blob/main/CLA.md)
            by posting a comment on this PR with exactly the text below.
          custom-allsigned-prcomment: All contributors have signed the CLA. ✅
          lock-pullrequest-aftermerge: false
