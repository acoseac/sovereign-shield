name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (lint · type · test · parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (dev extra)
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest
      - name: Parity vectors current
        run: python scripts/gen_shield_vectors.py --check

  web:
    name: web (shield parity · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24" # runs `node scripts/parity.ts` (native TS) without a flag
      - name: Install
        run: npm ci
      - name: Shield parity (TypeScript reproduces the Python vectors)
        run: npm run parity
      - name: Build
        run: npm run build
