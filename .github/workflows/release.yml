name: Release

# Build and publish to PyPI when a GitHub Release is published. Uses PyPI
# Trusted Publishing (OIDC) — no API token or long-lived secret is stored in the
# repo. See RELEASING.md for the one-time PyPI setup.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build & check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read # least privilege, scoped to this job (not workflow-wide)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # A dedicated environment lets you gate the publish behind a required
    # reviewer in Settings → Environments → pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/sovereign-shield-ch
    permissions:
      id-token: write # mint the short-lived OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Pinned to a full commit SHA (supply-chain hardening for the publish step).
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
